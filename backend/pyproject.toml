[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
    "sqlmodel==0.0.48",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
]

[dependency-groups]
dev = [
    # Code quality
    "pre-commit==4.7.0",  # https://github.com/pre-commit/pre-commit
    "black==26.10.1",  # https://github.com/psf/black
    "flake8==7.4.1",  # https://github.com/PyCQA/flake8
    "isort==8.0.1",
    # Testing
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 79
